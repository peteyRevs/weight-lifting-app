# Installed by scripts/bootstrap.sh (`lefthook install`).
# The hooks are a fast pre-flight only; scripts/check.sh is the real gate.
pre-commit:
  parallel: true
  jobs:
    - name: swiftformat
      glob: "*.swift"
      run: mise exec -- swiftformat --lint {staged_files}
    - name: swiftlint
      glob: "*.swift"
      run: mise exec -- swiftlint lint --strict --quiet --config .swiftlint.yml {staged_files}

commit-msg:
  jobs:
    - name: conventional-commit
      run: scripts/check-commit-msg.sh {1}
