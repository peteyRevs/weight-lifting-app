# The PR gate (docs/ci-cd.md §2): scripts/check.sh as a developer runs it, split to spend fewer paid macOS
# minutes (Pete, 2026-09-27 and 2026-09-30) and, since 2026-11-11, less wall time: a Linux job runs the
# static checks, then two macOS Check jobs build iOS and each test half of the PR plan's targets
# (scripts/pr-shards.txt), then Coverage checks both halves together and gates coverage. Docs-only PRs
# start none of them; new pushes cancel old runs.
name: PR

on:
  pull_request:
    branches: [main]
  workflow_dispatch: # a manual run on any branch

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash # -eo pipefail

jobs:
  scope:
    name: Scope
    runs-on: ubuntu-24.04 # Linux minutes cost a tenth of macOS minutes
    timeout-minutes: 5
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2 # the PR merge commit and its base
      - name: Decide whether Check runs (not for docs-only PRs)
        id: scope
        run: |
          code=true
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            code=false
            # --no-renames lists a moved file under its old path too: moving code into docs/ is a code change.
            changed="$(git diff --name-only --no-renames HEAD^1 HEAD)"
            printf 'Changed files:\n%s\n' "$changed"
            while IFS= read -r file; do
              case "$file" in # docs-only is an allowlist: docs/, tasks/, design/, root-level *.md
                docs/* | tasks/* | design/* | '') ;;
                */*) code=true ;; # anything else in a folder, Markdown included
                *.md) ;;
                *) code=true ;;
              esac
            done <<<"$changed"
          fi
          if [[ $code == false ]]; then echo "::notice::Docs-only change: Check is skipped."; fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  static:
    name: Static checks
    needs: scope
    if: needs.scope.outputs.code != 'false' # as Check: a missing output runs it
    # Format, lint, the package graph and pins, and every script suite that runs anywhere, at a tenth of
    # the macOS rate. The suites that need macOS ("# needs macOS:", scripts/tests/adversarial/run.sh) run
    # in Check. Same tool versions as the Mac: mise.toml.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history: check.sh's script tests read it (RP11: bootstrap-sha is an ancestor)
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - name: Lint, package graph and pins, script tests (check.sh --static-only)
        env:
          # SwiftLint's Linux build loads SourceKit (libsourcekitdInProc.so) from here, the image's Swift
          # toolchain. Without the library SwiftLint 0.65.1 stops with a fatal error; were the custom rules
          # skipped instead, the lint-rules*.test.sh fixtures, which expect them to fire, would fail.
          LINUX_SOURCEKIT_LIB_PATH: /usr/share/swift/usr/lib
        run: scripts/check.sh --static-only

  check:
    # Two shards (docs/ci-cd.md, "Shards"; tasks/features/F15-ios-ui-tests.md §2.4 a): one PR job's tests
    # took 2,251-2,581 s in #91's two attempts (a 3,128 s step at best, of a 4,500 s deadline), and #88
    # reached the deadline. Each shard builds as the unsharded job did, then tests its own targets; Coverage
    # checks both shards' bundles together and gates their coverage.
    name: Check (shard ${{ matrix.shard }}/2)
    # After Static checks: a lint failure then costs no macOS minutes. Check is skipped, and the run is red.
    needs: [scope, static]
    if: needs.scope.outputs.code != 'false' # a missing output runs Check
    strategy:
      fail-fast: false # a red shard leaves the other to finish: both report, and shard 1 saves the cache
      matrix:
        shard: [1, 2] # scripts/pr-shards.txt's shards; the job name and --shard say /2 (WF72)
    # Xcode 27 is only on this label, a public preview image (actions/runner-images#14404). macos-26
    # still has 26.6, but rolling back to it means reverting F32 as a whole: its lockfiles and snapshots
    # are Xcode 27's, and every later merge makes that harder (ADR-006 amendment).
    runs-on: xcode-27
    timeout-minutes: 82 # the step's 77, plus checkout, Xcode, mise, both caches and the uploads
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history: check.sh's script tests read it (RP11: bootstrap-sha is an ancestor)
      # The xcode-27 image links Xcode_27.0.app to Xcode_27.app. The pin is read as check.sh step 0 reads
      # it (check-xcode-version.sh), whitespace and a CRLF stripped.
      - name: Select Xcode from .xcode-version
        run: sudo xcode-select -s "/Applications/Xcode_$(tr -d '[:space:]' < .xcode-version).app" && xcodebuild -version
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - name: Cache Swift package checkouts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .derivedData/SourcePackages
          # An exact key only, no restore-keys: xcodebuild trusts checkouts over Package.resolved, so
          # another run's checkouts would let a stale one build (F32 notes, "Package pins").
          key: spm-${{ hashFiles('.xcode-version', 'LedgerKit/Package.resolved', 'Ledger.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
      # Compiled output, reused across runs: Xcode's compilation cache (LEDGER_COMPILATION_CACHE below). Each
      # entry's key hashes the compiler, its arguments and every input's contents, so a fresh checkout's
      # mtimes cannot fool it and a changed file always compiles. That makes restore-keys safe here, unlike
      # for the package checkouts: a run starts from its PR's newest cache, or main's. The keys still carry
      # the Xcode and both lockfiles, so a toolchain or package bump starts a new cache. Xcode validates the
      # cache once per boot (ValidateCAS), so a runner validates what it restored, and drops a corrupt one.
      # A run may read only its PR's caches and main's. Only main-cache.yml saves on main (a PR run
      # cannot), building what this job builds on each push to main, under these keys. So a PR's first run starts
      # from main's newest cache, and its later pushes and re-runs from its own (docs/ci-cd.md,
      # "Compilation cache").
      - name: Restore compiled output (Xcode compilation cache)
        id: compilation-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .derivedData/CompilationCache.noindex
          key: compilation-${{ hashFiles('.xcode-version', 'LedgerKit/Package.resolved', 'Ledger.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-${{ github.sha }}
          # The key without the commit: the newest cache this run may read, its PR's first, then main's.
          restore-keys: compilation-${{ hashFiles('.xcode-version', 'LedgerKit/Package.resolved', 'Ledger.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-
      # iOS only (Pete, 2026-09-30): F32's first run here reached the deadline below in the watchOS tests,
      # after a cold 684 s iOS build. watchOS stays in the full local gate, green before every merge
      # (docs/ci-cd.md §4), and in the nightly. Static checks ran on Linux; only the suites that need
      # macOS run here.
      - name: Format, macOS script tests, iOS build, one shard's tests (check.sh --ios-only --skip-static --shard)
        timeout-minutes: 77 # fails the step before the job times out, so the bundles still upload
        env:
          # s: 2 min before the step's timeout, check.sh interrupts xcodebuild (bundle finalized). Since
          # 2026-11-11 each shard tests about half (scripts/pr-shards.txt): 928 and 1,303 s in #94's first
          # run. The runner's build varies far more than the tests: 496 to 1,864 s with the compilation cache
          # restored (#94, 2026-11-12), and a 3,600 s deadline stopped a shard after that 1,864 s build. Its
          # worst, 1,864 s of build, 165 s of format and script tests, 12 s of catalogs and boot and a slow
          # runner's ~1,600 s of tests, is about 3,640 s; 4,500 s, the one job's deadline until then, leaves
          # about 860 s. A green run still takes about 35 minutes; only a slow runner uses the rest.
          LEDGER_XCODEBUILD_DEADLINE: 4500
          LEDGER_COMPILATION_CACHE: "YES" # quoted: YAML 1.1 reads a bare YES as true
          # Seeded property tests run their first 40 seeds here, not the PR plan's 200: xcodebuild hands a
          # TEST_RUNNER_ variable to the test runner without the prefix, where it replaces the plan's value.
          # This runner takes two to three times a developer Mac's time per case, and 200 seeds were a
          # fifth of the test step. The full local gate, green before every merge, runs the plan's 200,
          # and the nightly its 2,000 (docs/ci-cd.md, "Seeds on the runner").
          TEST_RUNNER_LEDGER_PROPERTY_SEED_COUNT: 40
          # The text-size and setting sweeps of hosted views keep their representatives here (TestSweep in
          # LedgerTestSupport): the smallest, default, largest non-accessibility and largest text sizes, and
          # the iPhone 17 plain beside the 375 pt phone with Bold Text and right to left. Those sweeps were
          # most of the test step. The full local gate, green before every merge, and the nightly set no
          # LEDGER_SWEEP and run every size and setting (docs/ci-cd.md, "Sweeps on the runner").
          TEST_RUNNER_LEDGER_SWEEP: pr
        run: scripts/check.sh --ios-only --skip-static --shard ${{ matrix.shard }}/2
      # A bundle is ~35,000 small files, which download-artifact failed to extract on the macOS runner
      # (five retries, every attempt); one tar file round-trips.
      - name: Pack this shard's test bundle
        run: tar -cf "PR-iOS-shard$SHARD.xcresult.tar" -C .derivedData/Results "PR-iOS-shard$SHARD.xcresult"
        env:
          SHARD: ${{ matrix.shard }}
      # Coverage reads this shard's test bundle. Not per attempt: "Re-run failed jobs" re-runs a red shard
      # and Coverage, not a green shard, so Coverage must find the green one's bundle under the same name.
      - name: Upload this shard's test bundle for Coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PR-iOS-shard${{ matrix.shard }}
          path: PR-iOS-shard${{ matrix.shard }}.xcresult.tar
          if-no-files-found: error
          overwrite: true # a re-run replaces its earlier attempt's bundle
          retention-days: 7
      - name: Upload result bundles and snapshot diffs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: results-${{ github.run_id }}-${{ github.run_attempt }}-shard${{ matrix.shard }}
          path: |
            .derivedData/Results
            .derivedData/SnapshotArtifacts
          include-hidden-files: true # both live under .derivedData/
          if-no-files-found: ignore
          retention-days: 7
      # After a red run too, so the push that fixes it starts warm; the cache holds only finished
      # compilations, each under its inputs' hash. Not when cancelled: a newer push is already running.
      # Shard 1 alone: both shards build the same thing under the same key, and only one save can take it.
      - name: Save compiled output
        if: ${{ matrix.shard == 1 && !cancelled() && steps.compilation-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .derivedData/CompilationCache.noindex
          key: ${{ steps.compilation-cache.outputs.cache-primary-key }}

  coverage:
    name: Coverage
    # check.sh step 5 for the shards (scripts/check-shards.sh): each shard's bundle ran exactly its targets,
    # the shards together ran every target of the PR plan once, and the coverage gate over both bundles,
    # at the same thresholds. After both shards passed; a red shard skips it, and the run is red.
    needs: [scope, check]
    if: needs.scope.outputs.code != 'false' # as Check
    runs-on: xcode-27 # xcresulttool and xccov from the Xcode that wrote the bundles
    timeout-minutes: 15 # two bundle downloads (a whole run's was 243 MB) and a minute of reading them
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Xcode from .xcode-version
        run: sudo xcode-select -s "/Applications/Xcode_$(tr -d '[:space:]' < .xcode-version).app" && xcodebuild -version
      - name: Check the Xcode against .xcode-version (as check.sh step 0)
        run: scripts/check-xcode-version.sh
      - name: Download both shards' test bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: PR-iOS-shard*
          merge-multiple: true # each artifact holds one tar, named for its shard
      - name: Unpack them
        run: |
          mkdir -p .derivedData/Results
          for n in 1 2; do tar -xf "PR-iOS-shard$n.xcresult.tar" -C .derivedData/Results; done
      - name: Both shards' results and coverage (check-shards.sh)
        run: scripts/check-shards.sh
