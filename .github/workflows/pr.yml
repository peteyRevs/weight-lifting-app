# The PR gate (docs/ci-cd.md §2): one macOS job runs scripts/check.sh as a developer does, within
# the free macOS minutes (Pete, 2026-09-27): docs-only PRs start no Mac; new pushes cancel old runs.
name: PR

on:
  pull_request:
    branches: [main]
  workflow_dispatch: # a manual run on any branch

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash # -eo pipefail

jobs:
  scope:
    name: Scope
    runs-on: ubuntu-latest # Linux minutes cost a tenth of macOS minutes
    timeout-minutes: 5
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2 # the PR merge commit and its base
      - name: Decide whether Check runs (not for docs-only PRs)
        id: scope
        run: |
          code=true
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            code=false
            # --no-renames lists a moved file under its old path too: moving code into docs/ is a code change.
            changed="$(git diff --name-only --no-renames HEAD^1 HEAD)"
            printf 'Changed files:\n%s\n' "$changed"
            while IFS= read -r file; do
              case "$file" in # docs-only is an allowlist: docs/, tasks/, design/, root-level *.md
                docs/* | tasks/* | design/* | '') ;;
                */*) code=true ;; # anything else in a folder, Markdown included
                *.md) ;;
                *) code=true ;;
              esac
            done <<<"$changed"
          fi
          if [[ $code == false ]]; then echo "::notice::Docs-only change: Check is skipped."; fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  check:
    name: Check
    needs: scope
    if: needs.scope.outputs.code != 'false' # a missing output runs Check
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history: check.sh's script tests read it (RP11: bootstrap-sha is an ancestor)
      - name: Select Xcode from .xcode-version
        run: sudo xcode-select -s "/Applications/Xcode_$(cat .xcode-version).app" && xcodebuild -version
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - name: Cache Swift package checkouts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .derivedData/SourcePackages
          key: spm-${{ hashFiles('.xcode-version', 'LedgerKit/Package.resolved', 'Ledger.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-
      - name: Format, lint, script tests, iOS, watchOS, coverage (check.sh)
        timeout-minutes: 27 # fails the step before the job times out, so the bundles still upload
        env:
          LEDGER_XCODEBUILD_DEADLINE: 1500 # s: 2 min before that, check.sh interrupts xcodebuild (bundle finalized)
        run: scripts/check.sh
      - name: Upload result bundles and snapshot diffs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .derivedData/Results
            .derivedData/SnapshotArtifacts
          include-hidden-files: true # both live under .derivedData/
          if-no-files-found: ignore
          retention-days: 7
