# Versions and changelog from Conventional Commits (docs/ci-cd.md §6). Each push
# to main opens or updates the release PR; merging it tags vX.Y.Z, which starts
# Xcode Cloud "Release". MARKETING_VERSION is bumped in Config/Base.xcconfig.
# A GITHUB_TOKEN PR starts no workflow, so pr.yml never runs on the release PR
# (saving macOS minutes); whoever merges it runs scripts/check.sh on it first.
name: Release Please

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # release branch, tag, GitHub release
      pull-requests: write # the release PR
      issues: write # its labels
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
