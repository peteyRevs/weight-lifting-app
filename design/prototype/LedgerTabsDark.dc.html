<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="border-top:1px solid rgba(244,242,237,.08);background:rgba(11,11,13,.86);backdrop-filter:blur(20px);padding:12px 26px 30px;display:flex;gap:4px">
<sc-for list="{{ items }}" as="t" hint-placeholder-count="3">
<button onClick="{{ t.go }}" style="flex:1;border:none;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:7px;padding:5px 0;font-family:Archivo">
<svg viewBox="0 0 24 24" style="width:22px;height:22px;fill:none;stroke:{{ t.fg }};stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round"><path d="{{ t.path }}"></path></svg>
<span style="font:500 10.5px/1 Archivo;letter-spacing:.02em;color:{{ t.fg }}">{{ t.label }}</span>
</button>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:402,&quot;height&quot;:84},&quot;tab&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;today&quot;,&quot;library&quot;,&quot;history&quot;],&quot;default&quot;:&quot;today&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onTab&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(k: string) =&gt; void&quot;}}">
const ICONS = {
  today: 'M4 19V9m5 10V5m5 14v-7m5 7V8',
  library: 'M3 12h2m14 0h2M7 9v6m10-6v6M7 12h10',
  history: 'M12 7v5l3.5 2M12 3a9 9 0 1 0 9 9',
};
class Component extends DCLogic {
  renderVals() {
    const active = this.props.tab || 'today';
    const go = this.props.onTab || (() => {});
    return {
      items: [['today', 'Today'], ['library', 'Library'], ['history', 'History']].map(([k, label]) => ({
        label, path: ICONS[k], go: () => go(k),
        fg: active === k ? '#FF5B22' : 'rgba(244,242,237,.34)',
      })),
    };
  }
}
</script>
</body>
</html>
